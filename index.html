<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOOD SLAY - Emoji</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0;padding:10px}
.logo{width:100px;height:100px;border-radius:50%;border:3px solid #ff1493;box-shadow:0 0 20px #ff1493;object-fit:cover;margin:8px auto;display:block}
h1{margin:5px;color:#ff1493;font-size:26px} h1 span{color:#fff}
#container{position:relative;width:100%;max-width:380px;margin:10px auto}
video{width:100%;border-radius:20px;border:3px solid #ff1493;display:block}
#emojiOverlay{position:absolute;top:10px;right:10px;font-size:60px;background:rgba(0,0,0,0.5);border-radius:50%;width:80px;height:80px;display:flex;align-items:center;justify-content:center;border:2px solid #ff1493}
#mood{font-size:30px;margin:12px;color:#ff1493;font-weight:bold}
#percent{color:#aaa;font-size:14px;margin:5px}
button{padding:13px 22px;background:#ff1493;color:#fff;border:0;border-radius:50px;font-size:14px;margin:4px}
#switch{background:#222;border:1px solid #ff1493}
</style>
</head>
<body>
<img src="IMG-20261007-WA3141.jpg" class="logo">
<h1>MOOD <span>SLAY</span></h1>

<div id="container">
<video id="v" autoplay muted playsinline></video>
<div id="emojiOverlay">😊</div>
</div>

<div id="mood">Tap START</div>
<div id="percent">AI will show your emoji</div>

<button id="btn">📸 START FRONT</button>
<button id="switch">🔄 BACK Camera</button>
<p style="color:#666;font-size:11px">100% Offline AI • Made by Chaitra, Bidar</p>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
let v=document.getElementById('v'), moodEl=document.getElementById('mood'), emojiEl=document.getElementById('emojiOverlay'), perEl=document.getElementById('percent');
let facing="user", stream=null;

async function startCam(f){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f}});
  v.srcObject=stream;
  v.style.transform=f==="user"?"scaleX(-1)":"scaleX(1)";
  detect();
 }catch(e){ moodEl.innerText="Allow Camera!"; }
}
async function load(f){
 moodEl.innerText="Loading AI... 10s ⏳";
 emojiEl.innerText="⏳";
 let M='https://justadudewhohacks.github.io/face-api.js/models';
 await faceapi.nets.tinyFaceDetector.loadFromUri(M);
 await faceapi.nets.faceExpressionNet.loadFromUri(M);
 await startCam(f);
 moodEl.innerText="Scanning your face...";
}
function detect(){
 setInterval(async()=>{
  let d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:224})).withFaceExpressions();
  if(d){
   let e=d.expressions;
   let top=Object.keys(e).reduce((a,b)=>e[a]>e[b]?a:b);
   let map={
     happy: {emoji:"😊", text:"HAPPY", color:"#ffeb3b"},
     sad: {emoji:"😢", text:"SAD", color:"#2196F3"},
     angry: {emoji:"😡", text:"ANGRY", color:"#f44336"},
     neutral: {emoji:"😐", text:"CALM", color:"#9e9e9e"},
     surprised: {emoji:"😲", text:"SURPRISED", color:"#ff9800"},
     fearful: {emoji:"😨", text:"SCARED", color:"#9c27b0"},
     disgusted: {emoji:"🤮", text:"DISGUST", color:"#4caf50"}
   };
   let m=map[top]||{emoji:"😐",text:top.toUpperCase(),color:"#ff1493"};
   emojiEl.innerText=m.emoji;
   emojiEl.style.borderColor=m.color;
   moodEl.innerText=m.emoji+" "+m.text;
   moodEl.style.color=m.color;
   perEl.innerText=`Happy ${Math.round(e.happy*100)}% | Sad ${Math.round(e.sad*100)}% | Angry ${Math.round(e.angry*100)}% | Surprise ${Math.round(e.surprised*100)}%`;
  } else {
   emojiEl.innerText="❓";
   moodEl.innerText="No face - come closer 💡";
  }
 },500);
}
document.getElementById('btn').onclick=()=>{facing="user";load(facing);document.getElementById('btn').style.display='none';};
document.getElementById('switch').onclick=async()=>{
 facing=facing==="user"?"environment":"user";
 await startCam(facing);
 document.getElementById('switch').innerText=facing==="user"?"🔄 BACK Camera":"🔄 FRONT Camera";
};
</script>
</body>
</html>
