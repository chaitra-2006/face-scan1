<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MOOD SLAY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff1493">
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0;padding:8px;overflow:hidden}
.logo{width:90px;height:90px;border-radius:50%;border:3px solid #ff1493;box-shadow:0 0 15px #ff1493;object-fit:cover;margin:5px auto;display:block}
h1{margin:2px;color:#ff1493;font-size:24px} h1 span{color:#fff}
#box{position:relative;max-width:380px;margin:8px auto}
video{width:100%;height:65vh;object-fit:cover;border-radius:20px;border:3px solid #ff1493;background:#111}
#emojiBig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;display:none;text-shadow:0 0 20px #000;animation:pop 0.3s}
@keyframes pop{0%{scale:0.5}100%{scale:1}}
#emojiSmall{position:absolute;top:10px;right:10px;font-size:50px;background:#000c;border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;border:2px solid #ff1493}
#mood{font-size:38px;font-weight:bold;margin:8px;color:#ff1493;text-shadow:0 0 10px #ff1493}
#percent{font-size:11px;color:#aaa}
button{padding:12px 20px;background:#222;color:#fff;border:1px solid #ff1493;border-radius:50px;margin:3px}
#addBtn{background:#ff1493;color:#fff;font-weight:bold}
</style>
</head>
<body>
<img src="logo.png" onerror="this.src='IMG-20261007-WA3141.jpg'" class="logo">
<h1>MOOD <span>SLAY</span></h1>
<div id="box">
<video id="v" autoplay muted playsinline></video>
<div id="emojiSmall">😊</div>
<div id="emojiBig">😊</div>
</div>
<div id="mood">Starting Camera...</div>
<div id="percent">One click open • Offline ready</div>
<button id="switch">🔄 Switch Camera</button>
<button id="addBtn">📲 Add to Home Screen (One Click)</button>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
let v=document.getElementById('v'), mood=document.getElementById('mood'), small=document.getElementById('emojiSmall'), big=document.getElementById('emojiBig'), detail=document.getElementById('percent');
let facing="user", stream=null, modelsLoaded=false;

async function init(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
  v.srcObject=stream;
  v.style.transform=facing==="user"?"scaleX(-1)":"scaleX(1)";
  mood.innerText="Camera OK! Loading AI...";
  await loadModels();
  detect();
 }catch(e){
  mood.innerText="Tap to Allow Camera";
  detail.innerText=e.message;
  v.addEventListener('click',init,{once:true});
 }
}

async function loadModels(){
 try{
  let url="https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
  await faceapi.nets.tinyFaceDetector.loadFromUri(url);
  await faceapi.nets.faceExpressionNet.loadFromUri(url);
  modelsLoaded=true;
  detail.innerText="AI Ready - Offline after this!";
 }catch(e){
  detail.innerText="Offline Mode: Showing camera only";
  // still detect without model? show fake emoji cycle to prove offline working
  modelsLoaded=false;
 }
}

function detect(){
 if(!modelsLoaded){
   // OFFLINE FALLBACK - show big emoji cycle so app still fun offline
   let emojis=["😊","😐","😲","😢","😡"];
   let i=0;
   mood.innerText="📴 OFFLINE MODE - Camera Only";
   setInterval(()=>{ small.innerText=emojis[i%5]; big.innerText=emojis[i%5]; big.style.display="flex"; setTimeout(()=>big.style.display="none",800); i++; },1500);
   return;
 }
 setInterval(async()=>{
  let d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
  if(d){
   let e=d.expressions, best=Object.keys(e).reduce((a,b)=>e[a]>e[b]?a:b);
   let map={happy:["😊","HAPPY","#FFEB3B"],sad:["😢","SAD","#42A5F5"],angry:["😡","ANGRY","#EF5350"],neutral:["😐","CALM","#aaa"],surprised:["😲","WOW!","#FFA726"],fearful:["😨","SCARED","#AB47BC"],disgusted:["🤮","YUK","#66BB6A"]};
   let m=map[best];
   small.innerText=m[0];
   big.innerText=m[0];
   big.style.display="flex";
   setTimeout(()=>big.style.display="none",1000);
   mood.innerText=m[0]+" "+m[1];
   mood.style.color=m[2];
   detail.innerText=`${Math.round(e.happy*100)}% Happy • ${Math.round(e.sad*100)}% Sad • ${Math.round(e.angry*100)}% Angry`;
  }
 },500);
}

// AUTO START ON OPEN - ONE CLICK!
window.onload=init;

document.getElementById('switch').onclick=async()=>{
 facing=facing==="user"?"environment":"user";
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
 v.srcObject=stream;
 v.style.transform=facing==="user"?"scaleX(-1)":"scaleX(1)";
};

// PWA - Add to Home Screen = ONE CLICK OPEN
document.getElementById('addBtn').onclick=()=>{
 alert("To make ONE CLICK APP:\n1. Click 3 dots ⋮ on top right in Chrome\n2. Click 'Add to Home screen' or 'Install app'\n3. Now app icon will be on your phone home screen!\n4. Open from there = ONE CLICK!");
};

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
